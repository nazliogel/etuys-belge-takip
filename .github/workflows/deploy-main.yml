name: Main Sunucuya Aktar

on:
  push:
    branches:
      - main

concurrency:
  group: etuys-main-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Prod ortamını güncelle
    runs-on: ubuntu-latest

    steps:
      - name: Sunucuya bağlan ve prod ortamını güncelle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd /home/debian/etuys-belge-takip-prod

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose --env-file .env -f compose.prod.yml build

            docker compose --env-file .env -f compose.prod.yml up -d --wait database

            docker compose --env-file .env -f compose.prod.yml run --rm backend npx prisma migrate deploy

            docker compose --env-file .env -f compose.prod.yml up -d backend frontend

            docker compose --env-file .env -f compose.prod.yml ps